name: sigrok-pico

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PICO_SDK_VERSION: '2.1.1'
  PICO_BOARD: 'pico'

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pico-sdk cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        id: pico-sdk-cache
        with:
          path: pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}-${{ runner.os }}

      - name: Checkout pico-sdk
        if: steps.pico-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: raspberrypi/pico-sdk
          path: pico-sdk
          ref: ${{ env.PICO_SDK_VERSION }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pico-sdk submodules cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: pico-sdk/lib
          key: pico-sdk-submodules-${{ env.PICO_SDK_VERSION }}-${{ runner.os }}

      - name: Initialize pico-sdk submodules
        if: steps.pico-sdk-cache.outputs.cache-hit != 'true'
        run: |
          cd pico-sdk
          git submodule update --init --recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Configure CMake
        run: |
          cmake -B build \
            -S pico_sdk_sigrok \
            -G "Unix Makefiles" \
            -DPICO_BOARD=${{ env.PICO_BOARD }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_SDK_PATH="${GITHUB_WORKSPACE}/pico-sdk"

      - name: Build firmware
        run: cmake --build build -- -j $(nproc)

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp build/pico_sdk_sigrok.uf2 artifacts/
          cp build/pico_sdk_sigrok.elf artifacts/
          cp LICENSE artifacts/
          cp README.md artifacts/
          ls -lh artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sigrok-pico-${{ github.ref_name }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: sigrok-pico-${{ github.ref_name }}
          path: ./release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/pico_sdk_sigrok.uf2
            release/pico_sdk_sigrok.elf
            release/LICENSE
            release/README.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
